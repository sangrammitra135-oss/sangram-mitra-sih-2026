<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="arcGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff6a00" />
      <stop offset="35%" stop-color="#ffa500" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="65%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Path for Curved Bottom Text -->
    <path id="textArc" d="M 95 385 A 190 190 0 0 0 405 385" fill="none" />
  </defs>

  <!-- Outer White Disc -->
  <circle cx="250" cy="250" r="240" fill="#ffffff" />

  <!-- Outer Navy Blue Ring -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#073574" stroke-width="16" />

  <!-- Inner Gold Accent Ring -->
  <circle cx="250" cy="250" r="218" fill="none" stroke="#f5a623" stroke-width="8" />

  <!-- Top Tricolor Swoosh Arc (Saffron to Green) -->
  <path d="M 66 260 C 66 125 155 48 250 48 C 345 48 434 125 434 260 C 400 130 325 78 250 78 C 175 78 100 130 66 260 Z" fill="url(#arcGrad)" />

  <!-- Desk Base (Navy) -->
  <path d="M 98 348 L 402 348 L 358 395 L 142 395 Z" fill="#073574" />

  <!-- Student Body & Arms -->
  <!-- Left Arm writing -->
  <path d="M 190 248 C 160 252 135 272 120 298 C 114 308 122 322 135 320 C 145 318 190 318 228 318 L 195 258 Z" fill="#073574" />
  <path d="M 130 304 C 116 304 115 324 130 324 L 210 324 C 220 324 230 316 226 306 L 195 254 C 175 254 145 285 130 304 Z" fill="#073574" />

  <!-- Torso -->
  <path d="M 165 230 C 148 245 138 270 142 300 L 358 300 C 362 270 352 245 335 230 C 315 242 270 252 250 252 C 230 252 185 242 165 230 Z" fill="#073574" />

  <!-- Right Arm -->
  <path d="M 310 248 C 335 255 358 278 368 302 C 374 316 364 322 350 322 L 290 322 L 310 248 Z" fill="#073574" />

  <!-- Student Head -->
  <circle cx="250" cy="180" r="48" fill="#073574" />
  <circle cx="250" cy="180" r="46" fill="none" stroke="#ffffff" stroke-width="4" />

  <!-- Mortarboard (Graduation Cap) -->
  <polygon points="250,78 344,124 250,166 156,124" fill="#073574" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" />
  <!-- Cap Skull Band -->
  <path d="M 206 144 C 206 144 218 170 250 170 C 282 170 294 144 294 144 L 298 132 L 202 132 Z" fill="#073574" stroke="#ffffff" stroke-width="4" />

  <!-- Cap Tassel -->
  <circle cx="250" cy="122" r="6" fill="#073574" stroke="#ffffff" stroke-width="2" />
  <path d="M 254 124 Q 320 135 326 160" fill="none" stroke="#073574" stroke-width="4" />
  <path d="M 326 160 L 322 195 C 322 198 330 198 330 195 L 326 160" fill="#073574" />
  <circle cx="326" cy="162" r="3.5" fill="#073574" />

  <!-- Hand Holding Pen -->
  <path d="M 226 295 C 220 295 214 300 216 308 C 218 316 226 322 236 322 C 242 322 248 316 246 308 C 244 300 234 295 226 295 Z" fill="#073574" stroke="#ffffff" stroke-width="3" />
  <!-- Pen Stylus -->
  <polygon points="190,250 200,242 242,308 232,316" fill="#073574" stroke="#ffffff" stroke-width="3" />
  <polygon points="232,316 242,308 246,324" fill="#073574" />

  <!-- Exam / Assessment Paper Sheet (White Angled Perspective) -->
  <polygon points="195,302 368,302 408,374 162,374" fill="#ffffff" stroke="#073574" stroke-width="6" stroke-linejoin="round" />

  <!-- Exam Paper Lines (Navy) -->
  <line x1="206" y1="322" x2="306" y2="322" stroke="#073574" stroke-width="4.5" stroke-linecap="round" />
  <line x1="200" y1="340" x2="300" y2="340" stroke="#073574" stroke-width="4.5" stroke-linecap="round" />
  <line x1="190" y1="358" x2="300" y2="358" stroke="#073574" stroke-width="4.5" stroke-linecap="round" />

  <!-- Radio Options / Checkbox on Exam Paper -->
  <!-- Top Radio Option -->
  <circle cx="330" cy="322" r="7" fill="#ffffff" stroke="#073574" stroke-width="3.5" />
  
  <!-- Middle Option (Checked Badge with Checkmark) -->
  <circle cx="336" cy="340" r="10" fill="#073574" />
  <path d="M 330 340 L 334 345 L 342 335" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Bottom Radio Option -->
  <circle cx="344" cy="358" r="7" fill="#ffffff" stroke="#073574" stroke-width="3.5" />

  <!-- Bottom Curved Slogan: "Skill • Growth • Dream" -->
  <text font-family="'Plus Jakarta Sans', 'Outfit', Arial, sans-serif" font-size="28" font-weight="900" fill="#073574" letter-spacing="1.5">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      Skill  <tspan fill="#f5a623" font-size="32" dy="-2">&#8226;</tspan><tspan dy="2">  Growth  </tspan><tspan fill="#f5a623" font-size="32" dy="-2">&#8226;</tspan><tspan dy="2">  Dream</tspan>
    </textPath>
  </text>
</svg>
